<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Fleet Monitor</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; max-width: 1000px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f5; }
        
        /* Visually flag anomalous rows */
        .anomaly-row { background-color: #fee2e2; color: #991b1b; font-weight: bold; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <h1>IoT Fleet Monitor</h1>
    <div style="position: relative; margin-bottom: 30px; height: 300px;">
        <canvas id="readings-chart"></canvas>
    </div>
    <table id="readings-table">
        <thead>
            <tr>
                <th>Sensor</th>
                <th>Type</th>
                <th>Value</th>
                <th>Timestamp</th>
                <th>Anomaly</th>
            </tr>
        </thead>
        <tbody id="readings-body">
            <!-- rows inserted by JavaScript -->
        </tbody>
    </table>

    <script>
        let chart = null;

        function groupAndSort(data) {
            const grouped = { temperature: [], vibration: [] };
    
            // Group and format the data
            data.forEach(reading => {
                if (reading.type === 'temperature' || reading.type === 'vibration') {
                    grouped[reading.type].push({
                        x: reading.timestamp,
                        y: reading.value,
                        anomaly: reading.is_anomaly
                    });
                }
            });

            // Sort ascending (oldest first) because Chart.js expects left-to-right time data
            grouped.temperature.sort((a, b) => new Date(a.x) - new Date(b.x));
            grouped.vibration.sort((a, b) => new Date(a.x) - new Date(b.x));

            return grouped;
        }


    function updateChart(data) {
        const grouped = groupAndSort(data);

        if (chart === null) {
            const ctx = document.getElementById('readings-chart');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        { 
                            label: 'Temperature (°C)', 
                            data: grouped.temperature, 
                            borderColor: 'orange', 
                            tension: 0.2,
                            pointBackgroundColor: (ctx) => ctx.raw?.anomaly ? 'red' : 'orange',
                            pointRadius: (ctx) => ctx.raw?.anomaly ? 6 : 2,
                            pointBorderColor: (ctx) => ctx.raw?.anomaly ? 'darkred' : 'orange'
                        },
                        { 
                            label: 'Vibration (mm/s)', 
                            data: grouped.vibration, 
                            borderColor: 'steelblue', 
                            tension: 0.2,
                            pointBackgroundColor: (ctx) => ctx.raw?.anomaly ? 'red' : 'steelblue',
                        pointRadius: (ctx) => ctx.raw?.anomaly ? 6 : 2,
                        pointBorderColor: (ctx) => ctx.raw?.anomaly ? 'darkred' : 'steelblue'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { 
                            type: 'time', 
                            time: { unit: 'second' } 
                        }
                    }
                }
            });
        } else {
            // As chart.update() re-evaluates point callbacks against the fresh array,
            // new anomalies will automatically render as large red dots without touching config.
            chart.data.datasets[0].data = grouped.temperature;
            chart.data.datasets[1].data = grouped.vibration;
            chart.update();
        }
    }

        async function loadReadings() {
            try {
                // 1. Fetch the data
                const response = await fetch('/readings?limit=50'); // Bumped to 50 for a better looking chart
                const data = await response.json();

                // Render chart
                updateChart(data);
                
                // 2. Get the tbody and clear old rows
                const tbody = document.getElementById('readings-body');
                tbody.innerHTML = ""; // Safe to use here because we are passing an empty string
                
                // 3. Build and append new rows securely using DOM methods
                data.forEach(reading => {
                    const tr = document.createElement('tr');
                    
                    if (reading.is_anomaly) {
                        tr.classList.add('anomaly-row');
                    }

                    // Define the exact order of columns
                    const fields = ['sensor_id', 'type', 'value', 'timestamp', 'is_anomaly'];
                    
                    fields.forEach(field => {
                        const td = document.createElement('td');
                        
                        // Formatting: restrict floats to 2 decimals, format booleans to Yes/No
                        if (field === 'value' && typeof reading[field] === 'number') {
                            td.textContent = reading[field].toFixed(2);
                        } else if (field === 'is_anomaly') {
                            td.textContent = reading[field] ? "Yes" : "No";
                        } else {
                            td.textContent = reading[field];
                        }
                        
                        tr.appendChild(td);
                    });
                    
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Failed to fetch readings:", error);
            }
        }

        // Call immediately to avoid a 3-second blank screen
        loadReadings();
        
        // Refresh the dashboard every 3 seconds
        setInterval(loadReadings, 3000);
    </script>
</body>
